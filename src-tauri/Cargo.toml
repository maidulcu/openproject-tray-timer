[package]
name = "dwl-timer"
version = "0.4.6"
description = "Desktop tray timer for OpenProject with idle detection"
license = "MIT"
authors = ["Maidul Islam"]
repository = "https://github.com/maidulcu/openproject-tray-timer"
homepage = "https://github.com/maidulcu/openproject-tray-timer"
keywords = ["openproject", "time-tracking", "tauri", "tray", "idle"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "dwl_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
log = "0.4"
thiserror = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
zbus = "5"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
